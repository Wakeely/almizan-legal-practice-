<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: deep teal -->
  <rect width="512" height="512" rx="64" fill="#042f2e"/>

  <!-- Scales of Justice icon (white, centered top) -->
  <g transform="translate(256, 130) scale(2.5)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central beam -->
    <line x1="0" y1="-30" x2="0" y2="20"/>
    <!-- Horizontal beam -->
    <line x1="-35" y1="-20" x2="35" y2="-20"/>
    <!-- Base -->
    <line x1="-15" y1="20" x2="15" y2="20"/>
    <!-- Left pan -->
    <path d="M -35 -20 L -45 0 L -25 0 Z" fill="#ffffff" fill-opacity="0.2"/>
    <!-- Right pan -->
    <path d="M 35 -20 L 25 0 L 45 0 Z" fill="#ffffff" fill-opacity="0.2"/>
    <!-- Top ring -->
    <circle cx="0" cy="-32" r="4" fill="#ffffff"/>
  </g>

  <!-- Arabic text: الميزان -->
  <text x="256" y="340" text-anchor="middle" font-family="Tajawal, Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" direction="rtl">الميزان</text>

  <!-- English text: Al Mizan -->
  <text x="256" y="395" text-anchor="middle" font-family="Tajawal, Arial, sans-serif" font-size="32" font-weight="700" fill="#5eead4">Al Mizan</text>

  <!-- Tagline -->
  <text x="256" y="435" text-anchor="middle" font-family="Tajawal, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">Legal Practice System</text>
</svg>
